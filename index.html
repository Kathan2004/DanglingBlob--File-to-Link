<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Not Found</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #0b1020;
        color: #dbe5ff;
      }
      .card {
        background: #121936;
        border: 1px solid #2c3768;
        border-radius: 12px;
        padding: 18px;
        width: min(520px, 92vw);
      }
      a {
        color: #8fb2ff;
      }
      #canvas-particles {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas-particles"></canvas>
    <main class="card">
      <h1 style="margin:0 0 8px; font-size:1.2rem;">404</h1>
      <p style="margin:0;">Not found.</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/canvasparticles-js/dist/index.umd.min.js"></script>
    <script>
      new CanvasParticles('#canvas-particles', {
        background: false,
        particles: {
          color: 'rgba(99, 140, 255, 0.7)',
          ppm: 55,
          max: 120,
          connectDistance: 160,
          relSpeed: 0.7,
        },
        mouse: {
          interactionType: CanvasParticles.interactionType.MOVE,
          connectDistMult: 0.75,
        },
      }).start()
    </script>
  </body>
</html>
