<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload History</title>
    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }
      body {
        margin: 0;
        background:
          radial-gradient(1200px 500px at 10% -10%, rgba(62, 85, 196, 0.28), transparent 60%),
          radial-gradient(900px 450px at 110% 10%, rgba(35, 170, 137, 0.2), transparent 60%),
          #070c1b;
        color: #e7ecff;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      #canvas-particles {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
      }
      .card {
        width: min(1180px, 100%);
        background: linear-gradient(180deg, rgba(19, 27, 58, 0.96), rgba(14, 20, 45, 0.94));
        border: 1px solid #334185;
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.42);
        backdrop-filter: blur(6px);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.55rem;
        letter-spacing: 0.2px;
      }
      p {
        margin: 0 0 14px;
        color: #b7c4ff;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
        justify-content: space-between;
        align-items: center;
      }
      button,
      .button-link {
        border: 1px solid #4f68d9;
        background: linear-gradient(180deg, #3550ca, #233891);
        color: white;
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
        transition: transform 0.12s ease, filter 0.12s ease;
      }
      button:hover,
      .button-link:hover {
        transform: translateY(-1px);
        filter: brightness(1.05);
      }
      .muted {
        color: #95a6f7;
        font-size: 0.92rem;
      }
      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px;
        margin: 8px 0 12px;
      }
      .metric-card {
        border: 1px solid #3a4c96;
        border-radius: 10px;
        background: linear-gradient(180deg, rgba(25, 35, 74, 0.92), rgba(14, 21, 47, 0.9));
        padding: 10px;
      }
      .metric-label {
        color: #95a6f7;
        font-size: 0.82rem;
      }
      .metric-value {
        margin-top: 4px;
        font-size: 1rem;
        font-weight: 700;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        background: rgba(8, 14, 35, 0.7);
        border: 1px solid #2f3f7f;
        border-radius: 12px;
        overflow: hidden;
      }
      th,
      td {
        text-align: left;
        border-bottom: 1px solid #2a376f;
        padding: 10px 8px;
        vertical-align: top;
      }
      th {
        color: #b7c4ff;
        font-size: 0.9rem;
        background: rgba(16, 24, 53, 0.95);
        position: sticky;
        top: 0;
        z-index: 1;
      }
      tbody tr:hover {
        background: rgba(46, 73, 164, 0.17);
      }
      td a {
        color: #8fb2ff;
        word-break: break-all;
      }
      .expiry-badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.2px;
        border: 1px solid transparent;
      }
      .expiry-active {
        color: #b8ffd8;
        background: rgba(34, 148, 91, 0.22);
        border-color: rgba(104, 224, 162, 0.5);
      }
      .expiry-expired {
        color: #ffd0d0;
        background: rgba(168, 51, 51, 0.26);
        border-color: rgba(255, 140, 140, 0.45);
      }
      .expiry-never {
        color: #dde2ff;
        background: rgba(113, 129, 194, 0.25);
        border-color: rgba(176, 190, 255, 0.38);
      }
      .action-btn {
        border: 1px solid #4f68d9;
        background: #2a3ea7;
        color: white;
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
        font-weight: 600;
      }
      .danger-btn {
        border-color: #b64f4f;
        background: #7d2f2f;
      }
      .controls-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        padding: 10px 12px;
        border: 1px solid #2f3f7d;
        border-radius: 10px;
        background: rgba(12, 20, 45, 0.7);
      }
      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
        margin-bottom: 6px;
      }
      .filter-btn {
        border: 1px solid #3c519f;
        background: rgba(30, 45, 98, 0.7);
        color: #dbe5ff;
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 0.84rem;
        font-weight: 700;
      }
      .filter-btn.active {
        border-color: #88a4ff;
        background: linear-gradient(180deg, #4a66d8, #2b429d);
        color: #ffffff;
      }
      .checkbox-cell {
        width: 42px;
      }
      .checkbox-cell input[type='checkbox'] {
        width: 16px;
        height: 16px;
        accent-color: #4f68d9;
      }
      .pager {
        margin-top: 12px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        padding-top: 8px;
      }
      .pager button {
        padding: 8px 12px;
      }
      #loginBox {
        border: 1px solid #2c3768;
        border-radius: 10px;
        padding: 12px;
      }
      input {
        flex: 1;
        min-width: 180px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #4f68d9;
        background: #0d1430;
        color: #e7ecff;
      }
      .hidden {
        display: none;
      }
      @media (max-width: 760px) {
        table,
        thead,
        tbody,
        th,
        td,
        tr {
          display: block;
        }
        thead {
          display: none;
        }
        tr {
          border: 1px solid #2c3768;
          border-radius: 10px;
          margin-bottom: 10px;
          padding: 8px;
        }
        td {
          border: none;
          padding: 6px 4px;
        }
        td::before {
          content: attr(data-label) ': ';
          color: #95a6f7;
          font-weight: 600;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="canvas-particles"></canvas>
    <main class="card">
      <div class="row">
        <div>
          <h1>Upload History</h1>
          <p>Shows previously uploaded files with date and download links.</p>
        </div>
        <a id="backToUploadLink" class="button-link" href="/admin">Back To Upload</a>
      </div>

      <section id="historyBox">
        <div class="row">
          <div id="status" class="muted"></div>
          <button id="logoutBtn">Logout</button>
        </div>

        <section class="metrics-grid" id="metricsGrid">
          <article class="metric-card">
            <div class="metric-label">Total Uploads</div>
            <div class="metric-value" id="metricTotalUploads">0</div>
          </article>
          <article class="metric-card">
            <div class="metric-label">Storage Used</div>
            <div class="metric-value" id="metricStorageUsed">0 B</div>
          </article>
          <article class="metric-card">
            <div class="metric-label">Average File Size</div>
            <div class="metric-value" id="metricAvgSize">0 B</div>
          </article>
          <article class="metric-card">
            <div class="metric-label">Largest File</div>
            <div class="metric-value" id="metricLargestFile">0 B</div>
          </article>
          <article class="metric-card">
            <div class="metric-label">Latest Upload</div>
            <div class="metric-value" id="metricLatestUpload">-</div>
          </article>
        </section>

        <div class="controls-row">
          <label class="muted" for="selectAllCheckbox">
            <input id="selectAllCheckbox" type="checkbox" /> Select all on page
          </label>
          <button id="bulkDeleteBtn" class="danger-btn" disabled>Delete Selected + Files</button>
        </div>

        <div class="filter-row">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="expired">Expired</button>
          <button class="filter-btn" data-filter="never">Never Expire</button>
        </div>

        <table>
          <thead>
            <tr>
              <th class="checkbox-cell">Sel</th>
              <th>Uploaded At</th>
              <th>Stored Filename</th>
              <th>Download Name</th>
              <th>Expiry</th>
              <th>Policy</th>
              <th>Downloads</th>
              <th>Last Access</th>
              <th>Download Link</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="historyTableBody"></tbody>
        </table>
        <div class="pager">
          <button id="prevPageBtn" disabled>Previous</button>
          <span id="pageInfo" class="muted">Page 1</span>
          <button id="nextPageBtn" disabled>Next</button>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/canvasparticles-js/dist/index.umd.min.js"></script>
    <script type="module" src="/history.js"></script>
    <script>
      new CanvasParticles('#canvas-particles', {
        background: false,
        particles: {
          color: 'rgba(99, 140, 255, 0.7)',
          ppm: 55,
          max: 120,
          connectDistance: 160,
          relSpeed: 0.7,
        },
        mouse: {
          interactionType: CanvasParticles.interactionType.MOVE,
          connectDistMult: 0.75,
        },
      }).start()
    </script>
  </body>
</html>
